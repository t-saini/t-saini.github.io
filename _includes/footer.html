<footer class="site-footer text-center mt-5 py-3">
    <div>
        <p class="mb-1">
            &copy; {{ site.time | date: "%Y" }} {{ site.title }} · Powered by
            <a href="https://jekyllrb.com" target="_blank"><i class="fas fa-gem me-1"></i>Jekyll</a>
        </p>
        <p>
            <a href="https://github.com/{{ site.github_username | strip }}" target="_blank" class="footer-icon-link"
                aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="mailto:{{ site.email }}" class="footer-icon-link" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="{{ '/feed.xml' | relative_url }}" class="footer-icon-link" aria-label="RSS">
                <i class="fas fa-rss"></i>
            </a>
        </p>
    </div>
</footer>
