<style>
  html,

    height: 100%;

  .site-footer {
    margin-top: auto;

    border-top: 1px solid #5c6be6;
    color: #7f9dfd;
    font-size: 0.9rem;
    box-shadow: 0 -2px 10px rgba(92, 107, 230, 0.1);

  body {
    background: linear-gradient(160deg, #0a1b3a, #000000 90%);
    font-family: 'Inter', sans-serif;
    color: #ccd6f8;
    background-attachment: fixed;
    background-size: 300% 300%;
    animation: flickerBackground 30s infinite alternate ease-in-out;
  }

  /* isolate transitions to page-wrapper only */
  .page-wrapper {
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  body.page-loaded .page-wrapper {
    opacity: 1;
    transform: scale(1);
  }

  body.page-fade-out .page-wrapper {
    opacity: 0;
    transform: scale(0.98);
  }

  @keyframes flickerBackground {
    0% {
      background-position: 0% 50%;
    }

    100% {
      background-position: 100% 50%;
    }
  }

  body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 20% 80%, rgba(100, 150, 255, 0.1) 0%, transparent 60%),
      radial-gradient(circle at 80% 20%, rgba(90, 130, 250, 0.08) 0%, transparent 65%);
    animation: backgroundPulse 8s infinite ease-in-out alternate;
  }

  @keyframes backgroundPulse {
    0% {
      filter: blur(2px);
      opacity: 0.4;
    }

    100% {
      filter: blur(4px);
      opacity: 0.7;
    }
  }
